name: Publish plugin release

# 打 v* tag 自动发版；也可在 Actions 手动触发（版本默认读 metadata.yaml）。
# AstrBot 依据 metadata.yaml 的 repo + 版本检查更新，所以每次发版只需改版本并打 tag。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则读取 metadata.yaml）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="$(grep -m1 '^version:' metadata.yaml | sed -E 's/version:[[:space:]]*//; s/[^0-9A-Za-z.+-]//g')"
            fi
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "resolved version=${VERSION} tag=${TAG}"

      - name: Validate sources
        shell: bash
        run: |
          python3 -m compileall -q .
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Build plugin zip
        shell: bash
        run: python3 .github/scripts/build_release.py --version "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }} · 抖音陪伴 · 共同经历
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/astrbot_plugin_douyin_companion-${{ steps.ver.outputs.tag }}.zip
            dist/astrbot_plugin_douyin_companion-${{ steps.ver.outputs.tag }}.zip.sha256
          body: |
            ## 安装

            下载 `astrbot_plugin_douyin_companion-${{ steps.ver.outputs.tag }}.zip`，
            在 **AstrBot WebUI → 插件 → 本地安装 / 上传插件** 选择该 zip；
            或解压到 `AstrBot/data/plugins/` 后重载插件。

            zip 内已包含一层 `astrbot_plugin_douyin_companion/` 目录，目录名与
            `metadata.yaml` 一致；`.sha256` 用于校验完整性。

            ## 首次配置

            1. **读路径**：独立 venv 安装 `dy-cli==0.2.2` 与 `aiohttp`，把 `python_path` 指向该解释器；
            2. **账号侧**：AstrBot 环境执行 `pip install playwright>=1.45`（只装包，不下载浏览器），
               打开 `enable_browser`，发 `/抖音登录` 扫码；`/抖音状态 登录` 复查；
            3. WebUI 保存一次插件配置，发 `/抖音状态` 与 `/抖音自检` 自检。

            ## 能力与安全

            - 只读：热榜 / 搜索 / 详情 / 抽帧 / 视频理解 / 推荐流 / 评论 / 私信收件箱。
            - 写（**默认全部关闭**）：点赞 / 发评论 / 转发 / 发私信 / 投稿。
            - 写操作需同时满足：`enable_browser` + `writes_enabled` + `write_actions` + 每日额度；
              私信/转发还需收件人白名单，投稿需 `publish_allow_dir`；`write_dry_run` 默认开启。
              模型调用必须 `confirm=true`，没有 `force` 后门。
            - 评论 / 私信请保持 `browser_headless=false`（无头模式拿不到完整评论区）。
            - 使用非官方接口与页面自动化，仅供个人学习研究；遇风控请人工处理，不要硬刷。
            - 许可 MIT，上游归属见 `NOTICE.md` / `LICENSE-UPSTREAM`；
              上游能力对照见 `docs/UPSTREAM_MAPPING.md`。
